conky.config = {
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 70,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_colour = '1a1a2e',
    own_window_argb_value = 190,
    border_inner_margin = 14,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    update_interval = 5,
    use_xft = true,
    font = 'monospace:bold:size=13',
    default_color = 'white',
    color1 = 'E8825A',
    color2 = 'FF3DF2',
    color3 = 'FF4444',
    color4 = '50FA7B',
};

-- THREAT, UFW BLOCKS, AUTH FAILS, LAST FAIL, SUDO EVENTS and NEW LISTEN
-- come from the secstatus daemon (/run/secstatus/conky.txt).
conky.text = [[
${color1}${font monospace:bold:size=20}SEC//STATUS${font}${color}
${color2}${hr 2}${color}
FIREWALL    ${if_match "${execi 30 systemctl is-active ufw}" == "active"}${color4}ON${else}${color3}OFF${endif}${color}
${execpi 5 cat /run/secstatus/conky.txt 2>/dev/null || echo 'DAEMON      ${color3}OFFLINE${color}'}
OPEN PORTS  ${execi 120 ss -tuln | tail -n +2 | wc -l}
PUBLIC IP   ${execi 600 curl -4 -s --max-time 5 https://ifconfig.me | sed "s/^[0-9]*.[0-9]*/x.x/"}
LOCAL IP    ${addr wlp0s20f3}
]]
